version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - APP_VERSION=1.0.0
      # Uncomment below and add a postgres service when ready to use a real DB
      # - DATABASE_URL=postgresql://taskflow:password@db:5432/taskflow
    volumes:
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_ENV=development
    depends_on:
      - backend

  # Uncomment when you want to practice with a real database
  # db:
